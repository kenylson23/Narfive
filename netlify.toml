[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirecionamentos principais
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Redirecionamento para imagens antigas
[[redirects]]
  from = "/images/*"
  to = "/assets/images/:splat"
  status = 200
  force = true

# Cabeçalhos para assets
[[headers]]
  for = "/assets/**"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeçalhos para JavaScript
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeçalhos para CSS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Cabeçalhos para HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Configuração de funções
[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  external_node_modules = ["@prisma/client"]

# Configurações de otimização
[context.production]
  command = "npm run build"
  environment = { NODE_ENV = "production" }